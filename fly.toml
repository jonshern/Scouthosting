# fly.toml — compass-staging (Next.js).
#
# Migrations run on container boot via the Dockerfile CMD:
#   prisma migrate deploy && npm run start
#
# Secrets live in `fly secrets`. APEX_DOMAIN, ALLOW_ADMIN_PASSWORD_LOGIN,
# DATABASE_URL, AUTH_TOKEN_SECRET, INVITE_SECRET, RSVP_SECRET are all
# already set on this app — see `fly secrets list -a compass-staging`.

app = 'compass-staging'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  NEXT_TELEMETRY_DISABLED = '1'
  PUSH_DRIVER = 'console'
  # tenancy/resolve.ts reads APEX_HOST. Mirrors APEX_DOMAIN secret.
  APEX_HOST = 'scoutingcompass.com'
  # Persist uploads across deploys/restarts. The mount below provides a
  # real disk at /data; lib/storage writes to LOCAL_UPLOADS_DIR.
  LOCAL_UPLOADS_DIR = '/data/uploads'
  STORAGE_DRIVER = 'local'

# Persistent volume for user uploads. Without this, every `fly deploy`
# and every machine restart wipes /app/var/uploads/* and the live demo
# 404s on every photo until someone re-seeds.
# Volume created via: fly volumes create compass_uploads --region ord --size 1
[[mounts]]
  source = 'compass_uploads'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine running so the Fly proxy never has to wake a
  # cold instance — eliminates the autostop ↔ healthcheck loop where
  # the proxy gives up before migrations + Next boot finish.
  min_machines_running = 1
  # No explicit [[http_service.checks]] block — Fly will fall back to
  # a basic TCP probe on internal_port, which reliably re-runs after
  # machine restarts. The Dockerfile HEALTHCHECK still hits /health
  # inside the container for liveness.

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
