name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels its older run; every push to main runs to
# the end, so each merge gets a full result.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Blue-green deploys keep the old revision serving on the new schema,
  # so new migrations must be expand-only. check-migrations.sh looks for
  # the keywords; check-migrations-schema.sh applies the migrations to
  # the base schema and fails on anything they take away, however the
  # SQL is written.
  migrations:
    name: Expand-only migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://compass:compass@localhost:5432/compass
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-migrations.sh "origin/${{ github.base_ref }}"
      - run: scripts/check-migrations-schema.sh "origin/${{ github.base_ref }}"

  mobile:
    name: Phone app typecheck, lint, tests, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Bundles the JavaScript the way a store build does, so a bad
      # import or a missing native module fails here, not on EAS.
      - name: iOS and Android bundles build
        run: npx expo export --platform ios --platform android --output-dir dist
        env:
          EXPO_OFFLINE: "1"

  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass_unit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://compass:compass@localhost:5432/compass_unit?schema=public
      TEST_DATABASE_URL: postgresql://compass:compass@localhost:5432/compass_unit?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # Fails when schema.prisma has changes no migration creates (a
      # missing table, foreign key or index).
      - name: Migrations match schema
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: shellcheck -x -S warning scripts/host/*.sh
      # The host Mac's backup and restore scripts, end to end: seed,
      # back up, restore into a scratch database and verify it. Then the
      # Lantern drill: Emmett's trail is lost and restored exactly, a
      # data rollback keeps newer progress, and an encrypted off-site
      # copy restores (scripts/host/journey-drill.sh).
      - name: Backup and restore drill
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          MASTER_KEY="$(openssl rand -hex 32)"
          export MASTER_KEY
          npm run db:seed
          scripts/host/backup.sh
          scripts/host/restore.sh --drill
          scripts/host/journey-drill.sh
          # Again with psql behind `docker exec -i`, as on the Mac, where
          # it reads stdin the host psql leaves alone.
          PATH="$PWD/scripts/host/test:$PATH" scripts/host/journey-drill.sh

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass_test
        # playwright.config.ts expects the test database on 5433.
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://compass:compass@localhost:5433/compass_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      # The fonts are bundled (src/app/fonts), so the build needs no network.
      - name: Build
        run: npm run build
        env:
          APEX_HOST: localhost
      # Outside links are checked daily by the Outside links workflow, not
      # here, so another site moving a page never fails a build.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
