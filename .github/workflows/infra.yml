# Terraform for infra/ (the family's GCP project): plan on PRs (shown in the
# job summary), apply on main. Does nothing until GCP_PROJECT_ID is set.
name: Infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
  TF_VAR_mail_from: ${{ vars.MAIL_FROM || 'Compass <noreply@example.org>' }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  plan:
    if: vars.GCP_PROJECT_ID != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform init -backend-config="bucket=${TF_VAR_project_id}-tfstate"
      - run: terraform plan -lock=false -no-color -out=tfplan | tee plan.txt
      - name: Plan summary
        if: always()
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: vars.GCP_PROJECT_ID != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform init -backend-config="bucket=${TF_VAR_project_id}-tfstate"
      - run: terraform apply -auto-approve
